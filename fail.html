<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 실패 | 봄바타 코리아</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#faf7f1;color:#1c1b19;min-height:100vh;display:grid;place-items:center;padding:40px 18px}
.box{width:min(560px,100%);background:#fff;border-radius:26px;padding:48px 40px;box-shadow:0 0 0 1px #e3dccf}
.logo{font-family:'Bodoni Moda',serif;letter-spacing:.14em;font-size:22px;margin-bottom:34px}
h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:40px}
h1 em{font-style:italic;color:#a8874f}
p{color:#55524c;font-size:14px;line-height:1.8;margin-top:14px}
code{font-size:12px;background:#f4f1ea;padding:2px 6px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 28px;border-radius:999px;background:#1c1b19;color:#fff;text-decoration:none;font-size:14px;margin-top:30px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">BOMBATA</div>
  <h1>결제가 <em>완료되지</em> 않았습니다</h1>
  <p id="m"></p>
  <p>장바구니는 그대로 남아 있습니다. 다시 시도하시거나 고객센터(02-3482-2701)로 문의해주세요.</p>
  <a class="btn" href="./">장바구니로 돌아가기</a>
</div>
<script>
const q = new URLSearchParams(location.search);
const LANG = (() => { try { return localStorage.getItem('bk_lang') || 'ko'; } catch { return 'ko'; } })();
const FX = { en: ['Payment was <em>not completed</em>', 'Your cart has been kept. Please try again or contact +82-2-3482-2701.', 'Back to cart'], ja: ['決済が<em>完了しません</em>でした', 'カートはそのまま残っています。もう一度お試しいただくか、+82-2-3482-2701 までお問い合わせください。', 'カートに戻る'], it: ['Pagamento <em>non completato</em>', 'Il carrello è stato conservato. Riprova o contatta +82-2-3482-2701.', 'Torna al carrello'] }[LANG];
if (FX) { document.documentElement.lang = LANG; document.querySelector('h1').innerHTML = FX[0]; document.querySelectorAll('p')[1].textContent = FX[1]; document.querySelector('.btn').textContent = FX[2]; }
const msg = q.get('message') || '결제가 취소되었습니다.';
document.getElementById('m').innerHTML = msg.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + (q.get('code') ? ` <code>${q.get('code').replace(/[^\w_-]/g, '')}</code>` : '');
</script>
</body>
</html>
