<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 완료 | 봄바타 코리아</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',sans-serif;background:#faf7f1;color:#1c1b19;min-height:100vh;display:grid;place-items:center;padding:40px 18px}
.box{width:min(620px,100%);background:#fff;border-radius:26px;padding:48px 40px;box-shadow:0 0 0 1px #e3dccf,0 40px 80px -50px rgba(0,0,0,.4)}
.logo{font-family:'Bodoni Moda',serif;letter-spacing:.14em;font-size:22px;margin-bottom:34px}
h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:44px;line-height:1.05}
h1 em{font-style:italic;color:#a8874f}
p.lead{color:#55524c;font-size:15px;line-height:1.8;margin:16px 0 28px}
.st{font-size:13px;border-radius:12px;padding:12px 14px;margin-bottom:22px;line-height:1.6}
.st.ok{background:#eef6ef;color:#285c35}.st.wait{background:#f4f1ea;color:#55524c}.st.test{background:#fff4dc;color:#7a5a17}.st.bad{background:#fdecea;color:#8c1d18}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #eee7da;font-size:14px}
.row span:first-child{color:#77736b}
.items{margin:8px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 28px;border-radius:999px;background:#1c1b19;color:#fff;text-decoration:none;font-size:14px;margin-top:30px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">BOMBATA</div>
  <h1 id="h">결제를 <em>확인</em>하고 있습니다</h1>
  <p class="lead" id="lead">잠시만 기다려주세요.</p>
  <div class="st wait" id="st">결제 승인 요청 중…</div>
  <div id="detail"></div>
  <a class="btn" href="./">쇼핑 계속하기</a>
</div>
<script>
const CONFIRM_URL = 'https://qoyvpxtvcwkonwdtkdhk.supabase.co/functions/v1/bombata-confirm';
(async () => {
  const q = new URLSearchParams(location.search);
  const paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = Number(q.get('amount'));
  let order = null; try { order = JSON.parse(localStorage.getItem('bk_order')); } catch {}
  const won = n => Number(n).toLocaleString('ko-KR') + '원';
  const $ = id => document.getElementById(id);
  const st = (cls, msg) => { $('st').className = 'st ' + cls; $('st').innerHTML = msg; };

  if (!paymentKey || !orderId) { $('h').innerHTML = '잘못된 <em>접근</em>입니다'; $('lead').textContent = ''; st('bad', '결제 정보가 없습니다.'); return; }
  if (order && order.orderId === orderId && order.amount !== amount) {
    $('h').innerHTML = '결제 금액 <em>불일치</em>'; $('lead').textContent = ''; st('bad', '주문 금액과 결제 금액이 다릅니다. 결제가 승인되지 않았습니다. 고객센터(02-3482-2701)로 문의해주세요.'); return;
  }

  // 서버(Supabase Edge Function)에서 결제 승인 → 승인돼야 결제 완료
  let confirmed = false, testOnly = false, msg = '', receipt = null;
  try {
    const same = order && order.orderId === orderId;
    const r = await fetch(CONFIRM_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paymentKey, orderId, amount,
        items: same ? order.items : null, orderName: same ? order.orderName : null, preorder: same ? order.preorder : true,
        customer: same ? order.customer : null, ship: same ? order.ship : null }),
    });
    if (r.status === 404) testOnly = true;
    else { const j = await r.json(); confirmed = r.ok; msg = j.message || ''; receipt = j.receiptUrl || null; }
  } catch { testOnly = true; }

  if (confirmed) {
    $('h').innerHTML = '주문이 <em>완료</em>되었습니다';
    $('lead').textContent = order && order.preorder ? '사전예약해주셔서 감사합니다. 2027년 2월부터 결제 순서대로 출고되며, 출고 전 문자로 안내드립니다.' : '감사합니다. 1~3 영업일 내 출고 후 송장번호를 문자로 보내드립니다.';
    st('ok', '결제가 정상 승인되었습니다.' + (receipt ? ` <a href="${receipt}" target="_blank" rel="noopener" style="text-decoration:underline">영수증 보기</a>` : ''));
    try { localStorage.removeItem('bk_cart'); localStorage.removeItem('bk_order'); } catch {}
  } else if (testOnly) {
    $('h').innerHTML = '테스트 결제 <em>인증 완료</em>';
    $('lead').textContent = '결제 화면 인증까지 정상 동작했습니다.';
    st('test', '결제 승인 서버에 연결하지 못했습니다. 실제 결제는 일어나지 않았습니다.');
  } else {
    $('h').innerHTML = '결제가 <em>승인되지</em> 않았습니다';
    $('lead').textContent = '';
    st('bad', (msg || '결제 승인 중 오류가 발생했습니다.') + '<br>금액이 빠져나갔다면 자동 취소됩니다. 문의: 02-3482-2701');
  }

  const rows = [['주문번호', orderId], ['결제 금액', won(amount)]];
  if (order && order.orderId === orderId) {
    rows.push(['받는 분', order.customer.name]);
    rows.push(['배송지', `${order.ship.addr1} ${order.ship.addr2}`]);
  }
  $('detail').innerHTML = (order && order.orderId === orderId ? '<div class="items">' + order.items.map(i => `<div class="row"><span>${i.name} · ${i.color}</span><span>${i.q}개 · ${won(i.price * i.q)}</span></div>`).join('') + '</div>' : '')
    + rows.map(([a, b]) => `<div class="row"><span>${a}</span><span>${b}</span></div>`).join('');
})();
</script>
</body>
</html>
